name: Probe cost data sources

# Manual: lists the layout of public cost datasets so importers can be written against them.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Discover links
        run: node scripts/probe/costs-sources-2.ts
      - name: Inspect files
        shell: bash
        run: |
          set +e
          u() { node -e "console.log(require('./probe-urls.json')['$1'] ?? '')"; }
          peek_zip() {
            echo "##### $1"; unzip -l "$1" | head -30
            unzip -Z1 "$1" | while IFS= read -r f; do
              case "$f" in */) continue ;; esac
              echo "=== $f"
              case "$f" in
                *pharmacy*) echo "(skipped)";;
                *.zip) unzip -p "$1" "$f" > inner.zip; unzip -Z1 inner.zip | while IFS= read -r g; do echo "--- $g ($(unzip -p inner.zip "$g" | wc -l) lines)"; unzip -p inner.zip "$g" | head -4 | cut -c1-700; done ;;
                *.txt|*.csv) echo "($(unzip -p "$1" "$f" | wc -l) lines)"; unzip -p "$1" "$f" | head -4 | cut -c1-700 ;;
                *) echo "(binary)";;
              esac
            done
          }
          for k in asp aspCrosswalk orangeBook; do url=$(u $k); [ -n "$url" ] && curl -sSL -A "Vynthera data probe" -o $k.zip "$url" && peek_zip $k.zip; done
          for k in purple partb; do url=$(u $k); [ -n "$url" ] && { echo "##### $k"; curl -sSL -A "Vynthera data probe" "$url" | head -5 | cut -c1-1500; }; done
          url=$(u va); [ -n "$url" ] && { echo "##### va $url"; curl -sSL -A "Vynthera data probe" -o va.bin "$url"; ls -la va.bin; file va.bin; }
          url=$(u formulary)
          if [ -n "$url" ]; then
            time curl -sSL -A "Vynthera data probe" -o formulary.zip "$url"
            peek_zip formulary.zip
          fi
