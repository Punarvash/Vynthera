name: Import cost data

# Weekly refresh of public drug prices and coverage (NADAC, Medicare Part D and Part B, Medicare plan formularies,
# negotiated Medicare prices, VA Federal Supply Schedule).
# To refresh now: Actions -> Import cost data -> Run workflow.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-costs
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download and process datasets
        run: node scripts/costs/import.ts
      - name: Commit updated data
        if: always()
        run: |
          git config user.name "vynthera-bot"
          git config user.email "vynthera-bot@users.noreply.github.com"
          git add data/costs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update cost data ($(date -u +%F))"
            git push
          fi
